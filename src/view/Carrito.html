<style>
  .container {
    margin-top: 1%;
  }

  .lbl-container {
    margin-top: 1%;
    margin-left: 2%;
    display: flex;
    justify-content: space-between;
  }

  .tabla-container {
    z-index: 0;
  }

  .table {
    z-index: 1;
  }

  .table-body {
    border-collapse: collapse;
  }

  #datatable_inventario {
    border: 1px solid #ccc;
  }

  thead tr th {
    color: #ffff;
  }

  thead {
    background-color: #637c98;
  }

  .line {
    width: 100%;
    background-color: #ccc;
    height: 1px;
  }

  .total-box input {
    border: 1px solid #cccc;
    background-color: #f2f2f2;
    border: none;
    font-size: 34px;
    margin-top: 5%;
    margin-left: 20%;
    width: 60%;
    height: 30%;
  }
  #total-label {
    position: relative;
    left: 30%;
    margin-top: 5%;
  }
</style>

<dialog id="select-client-dialog" class="show-dialog">
  <form>
    <div id="close">
      <i class="fa-solid fa-circle-xmark"></i>
    </div>

    <div class="elements-container">
      <h3>Seleccione el cliente</h3>
      <select id="combo-box"></select>
      <button id="btn-cliente" class="btn btn-primary">continuar</button>
    </div>
  </form>
</dialog>

<dialog id="select-pay-dialog" class="show-dialog">
  <form>
    <div class="flex justify-end p-1 w-full">
      <i id="close-pay" class="fa-solid fa-circle-xmark"></i>
    </div>
    <div class="w-full py-2 flex justify-center">
      <h3 class="mx-auto">Metodo de Pago</h3>
    </div>
    <div class="bg-blue-500b flex justify-between py-2 px-4">
      <button
        id="btnEfectivo"
        class="bg-orange-600 !rounded text-white !no-border p-2 hover:bg-orange-800"
      >
        Efectivo
      </button>
      <button
        id="BtnDebito"
        class="bg-orange-600 !rounded text-white no-border p-2 hover:bg-orange-800"
      >
        Debito
      </button>
      <button
        id="BtnCredito"
        class="bg-orange-600 !rounded text-white no-border p-2 hover:bg-orange-800"
      >
        Credito
      </button>
      <button
        id="BtnDolares"
        class="bg-orange-600 !rounded text-white no-border p-2 hover:bg-orange-800"
      >
        dolares
      </button>
    </div>
    <div class="flex justify-around px-4 py-2 my-2">
      <input
        class="border border-black px-2"
        id="inputPay"
        type="number"
        name=""
        id="pagoCantidad"
        placeholder="$0.00"
      />
      <button
        id="btnAddPay"
        class="bg-slate-600 !rounded text-white no-border p-2 hover:bg-slate-800"
      >
        Agregar
      </button>
    </div>
    <div class="grid grid-cols-2 gap-4 w-3/4 mx-auto my-4">
      <!-- Fila 1 -->
      <label class="font-bold text-black p-auto text-3xl">Subtotal</label>
      <label id="lblSubtotal" class="font-bold text-black p-auto text-3xl"
        >$100.00</label
      >

      <!-- Fila 2 -->
      <label class="font-bold text-black p-auto text-3xl">Pago</label>
      <label id="lblPago" class="font-bold text-black p-auto text-3xl"
        >$0.00</label
      >

      <!-- Línea divisoria que cruza ambas columnas -->
      <div class="col-span-2 border-b-2 border-gray-400"></div>

      <!-- Fila 3 -->
      <label id="lblTitleTotal" class="font-bold text-black p-auto text-3xl">Total</label>
      <label id="lblTotal" class="font-bold text-black p-auto text-3xl"
        >$0.00</label
      >
    </div>

    <div class="flex w-full justify-center">
      <button
        id="btnPay"
        class="!w-1/2 !bg-green-500 !rounded py-2 text-white font-bold !text-2xl"
      >
        Continuar
      </button>
    </div>
  </form>
</dialog>

<div class="row">
  <div class="lbl-container col-md-2 offset-md-1">
    <a href="#/creditos" id="LblCrear" class="text-xl font-bold text-black"
      ><i
        class="fa-solid fa-magnifying-glass-plus m-1 text-xl text-blue-500"
      ></i
      >Clientes</a
    >
  </div>
  <div class="container col-md-6 col-offset-1">
    <div class="search-input-box">
      <input type="text" placeholder="¿Qué producto buscas?" />
      <a href="#" target="_blank">
        <i class="fa-solid fa-magnifying-glass icon"> </i>
      </a>
      <ul class="container-suggestions">
        <li>sugerencia 1</li>
        <li>sugerencia 2</li>
        <li>sugerencia 3</li>
      </ul>
    </div>
  </div>
</div>

<div class="Top-box-container col-md-8 offset-md-2">
  <div class="col-md-4 total-box">
    <div class="title-container">
      <span>Total</span>
      <h2 id="Lbl-cliente"></h2>
    </div>
    <div class="line"></div>
    <h2 id="total-label"></h2>
  </div>
  <div class="col-md-5 col-md-offset-1 total-box">
    <div class="codigo-container">
      <span>Codigo</span>
      <h3 id="Lbl-Producto"></h3>
    </div>
    <div class="line"></div>
    <input type="text" name="" id="input-codigo" />
    <p id="result"></p>
  </div>
</div>
<div class="row">
  <div
    class="col-md-9 tabla-container offset-md-1"
    style="height: 250px; overflow-y: scroll; margin-bottom: 2%"
  >
    <div class="tabla-scrollable">
      <table
        id="table"
        class="table table-striped table-bordered table-carrito"
      >
        <thead style="position: sticky; top: 0">
          <tr class="header-table">
            <th style="position: sticky; top: 0">Codigo</th>
            <th style="position: sticky; top: 0">Descripción</th>
            <th style="position: sticky; top: 0">Cantidad</th>
            <th style="position: sticky; top: 0">Tipo</th>
            <th style="position: sticky; top: 0">Precio</th>
            <th style="position: sticky; top: 0">Importe</th>
            <th style="position: sticky; top: 0">Acción</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="absolute bottom-0 justify-between flex h-1/6 w-full">
  <button id="eliminar" class="w-1/4">
    <i class="fa-solid fa-trash cursor-pointer !text-3xl text-red-400"></i>
  </button>
  <div class="flex w-1/2 items-center !px-[10%]">
    <button
      id="confirmar"
      class="bg-[#007bff] !rounded-xl text-white text-2xl font-bold px-2 mx-2 !no-underline"
      disabled
    >
      <i class="fa-solid fa-circle-arrow-right m-2 !text-3xl"></i>Realizar
      Compra
    </button>
  </div>
</div>
